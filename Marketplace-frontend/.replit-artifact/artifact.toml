kind = "web"
previewPath = "/"
title = "NFT Marketplace"
version = "1.0.0"
id = "artifacts/nft-marketplace"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20475

[services.development]
run = "pnpm --filter @workspace/nft-marketplace run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/nft-marketplace", "run", "build" ]
serve = "static"
publicDir = "artifacts/nft-marketplace/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20475"
BASE_PATH = "/"
